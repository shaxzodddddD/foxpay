<!DOCTYPE html>
<html lang="uz" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>FoxPay — Global Payment Protocol</title>
<meta name="description" content="FoxPay — AI-agent va B2B uchun zamonaviy to'lov infratuzilmasi.">
<meta name="theme-color" content="#FF6B00">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230B1120'/%3E%3Cpath d='M30 30l20 20 20-20v30a20 20 0 0 1-40 0V30z' fill='%23FF6B00'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
/* ============================================================
   1. CSS RESET & VARIABLES
   ============================================================ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;overflow-x:hidden;font-size:14px;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit;background:none;border:0;outline:none}
ul,ol{list-style:none}
img,svg{display:block;max-width:100%}

:root {
  --bg:#0B1120; --panel:#0F172A; --panel2:#141E33; --border:#1E293B;
  --fox:#FF6B00; --fox2:#E64A00; --cyan:#00F2FE;
  --text:#F8FAFC; --muted:#94A3B8;
  --green:#10B981; --green-bg:rgba(16,185,129,.12);
  --red:#EF4444; --red-bg:rgba(239,68,68,.12);
  --amber:#F59E0B; --amber-bg:rgba(245,158,11,.12);
  --blue:#3B82F6; --blue-bg:rgba(59,130,246,.12);
  --r:10px; --r-lg:14px; --r-xl:18px;
  --sh:0 2px 8px rgba(0,0,0,.3); --sh-lg:0 12px 40px rgba(0,0,0,.5);
  --sidebar-w:260px;
}
[data-theme="light"] {
  --bg:#F8FAFC; --panel:#FFFFFF; --panel2:#F1F5F9; --border:#E2E8F0;
  --text:#0F172A; --muted:#475569;
  --sh:0 2px 8px rgba(0,0,0,.05); --sh-lg:0 12px 40px rgba(0,0,0,.1);
}

/* ============================================================
   2. UTILITIES
   ============================================================ */
.flex{display:flex} .fcol{flex-direction:column} .ai-c{align-items:center} .jc-b{justify-content:space-between} .jc-c{justify-content:center}
.g1{gap:4px} .g2{gap:8px} .g3{gap:12px} .g4{gap:16px} .g6{gap:24px}
.grow{flex:1;min-width:0} .wrap{flex-wrap:wrap} .hide{display:none!important}
.t-xs{font-size:11px} .t-sm{font-size:12px} .t-md{font-size:13px} .t-lg{font-size:15px} .t-xl{font-size:18px} .t-2xl{font-size:24px} .t-3xl{font-size:32px}
.fw5{font-weight:500} .fw6{font-weight:600} .fw7{font-weight:700} .fw8{font-weight:800} .fw9{font-weight:900}
.muted{color:var(--muted)} .text-r{text-align:right} .text-c{text-align:center}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mono{font-family:ui-monospace,SFMono-Regular,monospace}
.mt2{margin-top:8px} .mt4{margin-top:16px} .mb2{margin-bottom:8px} .mb4{margin-bottom:16px}
.w100{width:100%} .rel{position:relative}

/* ============================================================
   3. COMPONENTS
   ============================================================ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:var(--r);font-weight:600;font-size:13px;transition:all .15s;border:1px solid transparent;white-space:nowrap}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:linear-gradient(135deg,var(--fox),var(--fox2));color:#fff;box-shadow:0 2px 8px rgba(255,107,0,.25)}
.btn-primary:hover{box-shadow:0 4px 16px rgba(255,107,0,.4)}
.btn-outline{border-color:var(--border);background:var(--panel);color:var(--text)}
.btn-outline:hover{background:var(--panel2)}
.btn-ghost{color:var(--muted)} .btn-ghost:hover{color:var(--text);background:var(--panel2)}
.btn-sm{padding:6px 12px;font-size:12px} .btn-block{width:100%}
.btn-icon{width:36px;height:36px;padding:0;border-radius:var(--r)}

.input{width:100%;padding:10px 14px;border-radius:var(--r);border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:13px;transition:all .15s}
.input:focus{border-color:var(--fox);box-shadow:0 0 0 3px rgba(255,107,0,.15)}
.field{margin-bottom:16px} .field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px}
.err{color:var(--red);font-size:11px;margin-top:4px;min-height:14px}

.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r-lg);padding:20px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:600}
.bd{width:6px;height:6px;border-radius:50%;background:currentColor}
.b-green{background:var(--green-bg);color:var(--green)}
.b-red{background:var(--red-bg);color:var(--red)}
.b-amber{background:var(--amber-bg);color:var(--amber)}
.b-cyan{background:rgba(0,242,254,.12);color:var(--cyan)}
.b-fox{background:rgba(255,107,0,.12);color:var(--fox)}

.toast-host{position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:10px}
.toast{padding:12px 18px;border-radius:var(--r);background:var(--panel);border:1px solid var(--border);color:var(--text);font-size:13px;font-weight:600;box-shadow:var(--sh-lg);animation:slideIn .3s}
.toast.success{border-color:var(--green);color:var(--green)}
.toast.error{border-color:var(--red);color:var(--red)}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:none;opacity:1}}

/* ============================================================
   4. LAYOUT & VIEWS
   ============================================================ */
.auth-wrap{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
.auth-side{background:radial-gradient(circle at 50% 50%,#0F172A 0%,#020617 100%);padding:48px;display:flex;flex-direction:column;justify-content:space-between;color:#F8FAFC}
.auth-main{padding:48px;display:flex;align-items:center;justify-content:center;background:var(--bg)}
.auth-box{width:100%;max-width:400px}
.auth-tabs{display:flex;gap:4px;background:var(--panel);padding:4px;border-radius:var(--r);margin-bottom:24px;border:1px solid var(--border)}
.auth-tab{flex:1;padding:8px;text-align:center;font-size:13px;font-weight:600;color:var(--muted);border-radius:8px;cursor:pointer}
.auth-tab.active{background:var(--panel2);color:var(--text)}

.dash{display:grid;grid-template-columns:var(--sidebar-w) 1fr;min-height:100vh}
.sidebar{background:var(--panel);border-right:1px solid var(--border);padding:20px 12px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.side-nav{display:flex;flex-direction:column;gap:2px;flex:1}
.si{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:9px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;transition:all .15s}
.si:hover{background:var(--panel2);color:var(--text)}
.si.active{background:rgba(255,107,0,.1);color:var(--fox);font-weight:600;border-left:3px solid var(--fox)}
.si svg{width:16px;height:16px}

.main{display:flex;flex-direction:column}
.topbar{background:rgba(15,23,42,.8);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:50}
.content{padding:24px;max-width:1300px;margin:0 auto;width:100%}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.kpi{background:var(--panel);border:1px solid var(--border);border-radius:var(--r-lg);padding:20px}
.kpi-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.kpi-l{font-size:12px;color:var(--muted);font-weight:600}
.kpi-v{font-size:24px;font-weight:800}

.wallet-banner{background:linear-gradient(135deg,var(--fox) 0%,var(--fox2) 100%);border-radius:var(--r-xl);padding:28px;color:#fff;box-shadow:0 12px 32px rgba(255,107,0,.25);margin-bottom:24px;position:relative;overflow:hidden}
.wallet-banner::before{content:'';position:absolute;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.1);top:-60px;right:-60px}
.wallet-amount{font-size:36px;font-weight:800;margin-top:6px;position:relative;z-index:1}
.wallet-actions{display:flex;gap:12px;margin-top:20px;position:relative;z-index:1}
.wallet-actions .btn{background:rgba(255,255,255,.15);color:#fff;backdrop-filter:blur(8px)}
.wallet-actions .btn:hover{background:rgba(255,255,255,.25)}

.table-wrap{background:var(--panel);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:12px 20px;background:rgba(255,255,255,.02);color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border)}
td{padding:14px 20px;border-bottom:1px solid var(--border);color:var(--text)}
tr:last-child td{border-bottom:0}
tr:hover td{background:rgba(255,255,255,.02)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}

.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:9000;padding:20px}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:var(--r-xl);width:100%;max-width:480px;overflow:hidden;animation:scaleIn .2s}
@keyframes scaleIn{from{transform:scale(.95);opacity:0}to{transform:none;opacity:1}}
.modal-head{padding:20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal-body{padding:20px}
.modal-foot{padding:16px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}

@media(max-width:1024px){
  .dash{grid-template-columns:1fr}
  .sidebar{position:fixed;left:-100%;top:0;bottom:0;z-index:200;transition:left .3s;width:280px;box-shadow:var(--sh-lg)}
  .sidebar.open{left:0}
  .auth-wrap{grid-template-columns:1fr}
  .auth-side{display:none}
  .kpis{grid-template-columns:1fr 1fr}
  .grid-2,.grid-3{grid-template-columns:1fr}
}
@media(max-width:600px){
  .kpis{grid-template-columns:1fr}
  .content{padding:16px}
  .wallet-actions{flex-direction:column}
}
</style>
</head>
<body>

<!-- Asosiy App Container -->
<div id="app"></div>

<!-- Global Xabarlar va Modallar -->
<div id="toast-host" class="toast-host" aria-live="polite"></div>
<div id="modal-host"></div>

<script>
'use strict';

/* ============================================================
   SVG ICONS & LOGO
   ============================================================ */
const Icons = {
  home: '<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>',
  wallet: '<path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4z"/>',
  send: '<line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>',
  card: '<rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/>',
  link: '<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',
  file: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>',
  bot: '<rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/><line x1="8" y1="16" x2="8" y2="16"/><line x1="16" y1="16" x2="16" y2="16"/>',
  repeat: '<polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>',
  code: '<polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/>',
  settings: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>',
  logout: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>',
  sun: '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>',
  moon: '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>',
  plus: '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
  x: '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
  check: '<polyline points="20 6 9 17 4 12"/>',
  refresh: '<polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>',
  trash: '<polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
  menu: '<line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>'
};

const getIcon = (name, size = 16) => {
  const path = Icons[name] || '';
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${path}</svg>`;
};

const LogoSVG = (size = 36) => `
<svg width="${size}" height="${size}" viewBox="0 0 100 100">
  <defs><linearGradient id="foxGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FF6B00"/><stop offset="100%" stop-color="#E64A00"/></linearGradient></defs>
  <rect width="100" height="100" rx="18" fill="#0B1120"/>
  <g transform="translate(10, 8)">
    <path d="M 26 21 A 18 18 0 0 1 54 21 L 59 15 A 24 24 0 0 0 21 15 Z" fill="#0B2545"/>
    <path d="M 30 26 A 12 12 0 0 1 50 26 L 54 21 A 18 18 0 0 0 26 21 Z" fill="#133863"/>
    <circle cx="40" cy="31" r="3.2" fill="#0B2545"/><circle cx="40" cy="31" r="1.6" fill="url(#foxGrad)"/>
    <path d="M 18 33 C 10 40 8 52 17 61 C 26 70 39 70 46 62 C 53 54 51 44 46 39 C 42 35 37 36 37 36 C 37 36 42 44 38 49 C 34 54 26 54 22 49 C 18 44 20 37 24 33 Z" fill="url(#foxGrad)"/>
    <path d="M 44 40 C 48 41 55 45 62 50 C 64 52 61 52 60 52 C 55 52 50 49 46 47 C 44 46 42 45 44 40 Z" fill="url(#foxGrad)"/>
    <path d="M 46 47 C 50 49 55 52 60 52 C 61 52 64 52 62 50 C 58 47 53 44 49 42 C 48 41 47 43 46 47 Z" fill="#0B2545"/>
    <path d="M 53 33 L 56 40 L 51 39 Z" fill="#0B2545"/>
  </g>
</svg>`;

const LogoFull = (size = 36) => `
<div style="display:inline-flex;align-items:center;gap:10px">
  ${LogoSVG(size)}
  <span style="font-weight:800;font-size:18px;letter-spacing:-.02em;color:var(--text)">FOX<span style="color:var(--cyan)">PAY</span></span>
</div>`;

/* ============================================================
   STATE MANAGEMENT & CONFIG
   ============================================================ */
const Config = {
  tokenKey: 'foxpay.token',
  userKey: 'foxpay.user',
  themeKey: 'foxpay.theme'
};

const State = {
  token: localStorage.getItem(Config.tokenKey) || null,
  user: JSON.parse(localStorage.getItem(Config.userKey) || 'null'),
  wallet: { balance_tiyin: 0, currency: 'UZS' },
  ledger: [],
  transfers: [],
  intents: [],
  keys: [],
  hooks: [],
  activeView: '/'
};

/* ============================================================
   UTILITY FUNCTIONS
   ============================================================ */
const $ = (s, e = document) => e.querySelector(s);
const $$ = (s, e = document) => [...e.querySelectorAll(s)];

const formatUZS = (tiyin) => tiyin == null ? '—' : (tiyin / 100).toLocaleString('uz-UZ', { maximumFractionDigits: 2 }) + " so'm";
const formatDate = (iso) => iso ? new Date(iso).toLocaleString('uz-UZ', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }) : '—';
const initials = (name) => name ? name.trim().split(/\s+/).map(n => n[0]).join('').slice(0, 2).toUpperCase() : '?';
const isValidEmail = (email) => /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email);
const escapeHTML = (str) => String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ============================================================
   THEME ENGINE
   ============================================================ */
const initTheme = () => {
  const t = localStorage.getItem(Config.themeKey) || 'dark';
  document.documentElement.setAttribute('data-theme', t);
};
const toggleTheme = () => {
  const current = document.documentElement.getAttribute('data-theme') || 'dark';
  const next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem(Config.themeKey, next);
  renderDashboard(State.activeView); // Re-render to update icon
};
initTheme();

/* ============================================================
   TOAST & MODAL ENGINE
   ============================================================ */
const toast = (msg, type = 'success') => {
  const host = $('#toast-host');
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `${getIcon(type === 'success' ? 'check' : 'x', 16)} <span>${escapeHTML(msg)}</span>`;
  host.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, 3000);
};

const openModal = (title, bodyHtml, footerHtml) => {
  const host = $('#modal-host');
  const back = document.createElement('div');
  back.className = 'modal-back';
  back.innerHTML = `
    <div class="modal">
      <div class="modal-head">
        <div class="t-lg fw7">${escapeHTML(title)}</div>
        <button onclick="closeModal()" class="btn-ghost btn-icon">${getIcon('x', 18)}</button>
      </div>
      <div class="modal-body">${bodyHtml}</div>
      ${footerHtml ? `<div class="modal-foot">${footerHtml}</div>` : ''}
    </div>`;
  back.onclick = (e) => { if (e.target === back) closeModal(); };
  host.appendChild(back);
};

const closeModal = () => { $('#modal-host').innerHTML = ''; };

/* ============================================================
   API CLIENT
   ============================================================ */
const api = {
  async req(path, method = 'GET', body = null) {
    const headers = { 'Content-Type': 'application/json' };
    if (State.token) headers['Authorization'] = `Bearer ${State.token}`;
    
    try {
      const res = await fetch(path, { method, headers, body: body ? JSON.stringify(body) : undefined });
      if (res.status === 401) {
        logout();
        throw new Error('Sessiya tugadi. Qayta kiring.');
      }
      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        throw new Error(data.detail || `Xato: ${res.status}`);
      }
      if (res.status === 204) return null;
      return await res.json();
    } catch (err) {
      throw new Error(err.message === 'Failed to fetch' ? 'Server bilan aloqa yo\'q' : err.message);
    }
  },
  get(p) { return this.req(p, 'GET'); },
  post(p, b) { return this.req(p, 'POST', b); },
  put(p, b) { return this.req(p, 'PUT', b); },
  del(p) { return this.req(p, 'DELETE'); }
};

/* ============================================================
   AUTHENTICATION
   ============================================================ */
const handleAuth = async (e, mode) => {
  e.preventDefault();
  const form = new FormData(e.target);
  const email = form.get('email').trim();
  const password = form.get('password');
  const name = form.get('name')?.trim();
  
  if (!isValidEmail(email)) return toast('Email formati noto\'g\'ri', 'error');
  if (password.length < 6) return toast('Parol kamida 6 belgi bo\'lishi kerak', 'error');
  if (mode === 'register' && (!name || name.length < 2)) return toast('Ismingizni to\'liq kiriting', 'error');

  const btn = e.target.querySelector('button[type="submit"]');
  const origText = btn.innerHTML;
  btn.innerHTML = 'Yuklanmoqda...';
  btn.disabled = true;

  try {
    const payload = mode === 'register' ? { name, email, password } : { email, password };
    const data = await api.post(`/api/auth/${mode}`, payload);
    
    State.token = data.token;
    State.user = data.user;
    localStorage.setItem(Config.tokenKey, State.token);
    localStorage.setItem(Config.userKey, JSON.stringify(State.user));
    
    toast(`Xush kelibsiz, ${data.user.name}!`);
    window.location.hash = '#/';
  } catch (err) {
    toast(err.message, 'error');
    btn.innerHTML = origText;
    btn.disabled = false;
  }
};

const logout = () => {
  State.token = null; State.user = null;
  localStorage.removeItem(Config.tokenKey);
  localStorage.removeItem(Config.userKey);
  window.location.hash = '#/login';
};

/* ============================================================
   ROUTER
   ============================================================ */
const router = () => {
  const hash = window.location.hash.replace('#', '') || '/';
  
  if (!State.token) {
    if (hash === '/register') renderAuth('register');
    else renderAuth('login');
    return;
  }

  if (hash === '/login' || hash === '/register' || hash === '/') {
    renderDashboard('/');
  } else {
    renderDashboard(hash);
  }
};

        <div class="field"><label>URL Manzil</label><input class="input" placeholder="https://sizning-sayt.uz/webhook"></div>
        <button class="btn btn-primary btn-block" onclick="toast('Saqlandi!')">Saqlash</button>
      </div>
    </div>`;
};

const createApiKey = async () => {
  try {
    const res = await api.post('/api/keys', { label: 'Default Key' });
    openModal('API Kalit Yaratildi', `
      <p class="t-sm muted mb4">Bu kalit faqat bir marta ko'rsatiladi.</p>
      <div class="input mono" style="background:var(--bg);padding:12px;word-break:break-all">${res.full_key}</div>
    `, `<button class="btn btn-primary" onclick="closeModal(); renderView('/dev')">Yopish</button>`);
  } catch (e) { toast(e.message, 'error'); }
};

const revokeKey = async (id) => {
  if (!confirm('Bu kalitni o\'chirmoqchimisiz?')) return;
  try {
    await api.del(`/api/keys/${id}`);
    toast('O\'chirildi');
    renderView('/dev');
  } catch (e) { toast(e.message, 'error'); }
};

          <div><div class="fw6 t-sm">2FA Autentifikatsiya</div><div class="muted t-xs">O'chirilgan</div></div>
          <button class="btn btn-outline btn-sm" onclick="toast('Tez orada!')">Yoqish</button>
        </div>
        <div class="flex jc-b ai-c" style="padding:12px 0">
          <div><div class="fw6 t-sm">Passkey</div><div class="muted t-xs">Face ID / Touch ID</div></div>
          <button class="btn btn-outline btn-sm" onclick="toast('Tez orada!')">Sozlash</button>
