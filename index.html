<style>
/* ============ RESET ============ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
img,svg{display:block;max-width:100%;height:auto}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit;background:none;border:0;outline:none}
a{color:inherit;text-decoration:none}
ul,ol{list-style:none}
html,body{height:100%}

/* ============ TOKENS ============ */
:root{
  --fox:#FF6B1A; --fox-600:#E85D0F; --fox-100:#FFE8D6;
  --cream:#FFF5EE; --ink:#1A1A1A; --ink2:#2A2A2A;
  --g50:#F9FAFB; --g100:#F3F4F6; --g200:#E5E7EB; --g300:#D1D5DB;
  --g400:#9CA3AF; --g500:#6B7280; --g600:#4B5563; --g700:#374151;
  --green:#10B981; --green-bg:#ECFDF5;
  --red:#EF4444; --red-bg:#FEF2F2;
  --amber:#F59E0B; --amber-bg:#FFFBEB;
  --blue:#3B82F6; --blue-bg:#EFF6FF;
  --r:10px; --r-lg:14px; --r-xl:18px;
  --sh:0 2px 8px rgba(0,0,0,.05),0 1px 2px rgba(0,0,0,.04);
  --sh-md:0 8px 24px rgba(0,0,0,.08);
  --sh-lg:0 16px 48px rgba(0,0,0,.14);
  --sidebar:240px;
  --font:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
[data-theme=dark]{
  --cream:#0B0B0D; --ink:#F5F5F6; --ink2:#E5E5E7;
  --g50:#121215; --g100:#17171B; --g200:#242429; --g300:#33333A;
  --g400:#7C7C86; --g500:#9C9CA5; --g600:#C0C0C8; --g700:#DCDCE2;
  --green-bg:#062E20; --red-bg:#3A0F0F; --amber-bg:#3A2408; --blue-bg:#0A1E38;
  --fox-100:#3D1F0A;
  --sh:0 2px 8px rgba(0,0,0,.4),0 1px 2px rgba(0,0,0,.3);
  --sh-md:0 8px 24px rgba(0,0,0,.5);
  --sh-lg:0 16px 48px rgba(0,0,0,.6);
}

body{font-family:var(--font);background:var(--cream);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow-x:hidden;font-size:14px}

/* ============ A11Y ============ */
.skip-link{position:absolute;left:-9999px;top:0;background:var(--ink);color:var(--cream);padding:10px 16px;z-index:10000;border-radius:0 0 8px 0}
.skip-link:focus{left:0}
*:focus-visible{outline:2px solid var(--fox);outline-offset:2px;border-radius:4px}

/* ============ UTILITIES ============ */
.flex{display:flex}.fcol{flex-direction:column}.ai-c{align-items:center}.ai-s{align-items:flex-start}.ai-e{align-items:flex-end}
.jc-b{justify-content:space-between}.jc-c{justify-content:center}.jc-e{justify-content:flex-end}
.g1{gap:4px}.g2{gap:8px}.g3{gap:12px}.g4{gap:16px}.g5{gap:20px}.g6{gap:24px}.g8{gap:32px}
.grow{flex:1;min-width:0}.wrap{flex-wrap:wrap}.shrink0{flex-shrink:0}
.hide{display:none!important}
.t-xs{font-size:11px}.t-sm{font-size:12px}.t-md{font-size:13px}.t-base{font-size:14px}.t-lg{font-size:15px}
.t-xl{font-size:18px}.t-2xl{font-size:22px}.t-3xl{font-size:28px}.t-4xl{font-size:36px}.t-5xl{font-size:48px}
.fw5{font-weight:500}.fw6{font-weight:600}.fw7{font-weight:700}.fw8{font-weight:800}.fw9{font-weight:900}
.muted{color:var(--g500)}.text-r{text-align:right}.text-c{text-align:center}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.92em}
.w100{width:100%}.h100{height:100%}.rel{position:relative}.abs{position:absolute}
.mt1{margin-top:4px}.mt2{margin-top:8px}.mt3{margin-top:12px}.mt4{margin-top:16px}.mt6{margin-top:24px}.mt8{margin-top:32px}
.mb1{margin-bottom:4px}.mb2{margin-bottom:8px}.mb3{margin-bottom:12px}.mb4{margin-bottom:16px}.mb6{margin-bottom:24px}.mb8{margin-bottom:32px}
.p1{padding:4px}.p2{padding:8px}.p3{padding:12px}.p4{padding:16px}.p5{padding:20px}.p6{padding:24px}
.divider{height:1px;background:var(--g200);margin:12px 0}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}

/* ============ BUTTONS ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:var(--r);font-weight:600;font-size:13px;transition:transform .1s,box-shadow .15s,background .15s,border-color .15s;white-space:nowrap;user-select:none;border:1px solid transparent;line-height:1.2}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn-primary{background:linear-gradient(135deg,var(--fox),var(--fox-600));color:#fff;box-shadow:0 2px 8px rgba(255,107,26,.25)}
.btn-primary:hover:not(:disabled){box-shadow:0 4px 16px rgba(255,107,26,.35)}
.btn-outline{border-color:var(--g200);color:var(--ink);background:var(--cream)}
.btn-outline:hover:not(:disabled){background:var(--g100);border-color:var(--g300)}
.btn-ghost{color:var(--g600)}
.btn-ghost:hover:not(:disabled){background:var(--g100);color:var(--ink)}
.btn-danger{background:var(--red);color:#fff}
.btn-danger:hover:not(:disabled){background:#DC2626}
.btn-sm{padding:6px 11px;font-size:12px;border-radius:8px}
.btn-xs{padding:4px 9px;font-size:11px;border-radius:7px}
.btn-lg{padding:12px 22px;font-size:14px;border-radius:12px}
.btn-block{width:100%}
.btn-icon{width:36px;height:36px;padding:0;border-radius:var(--r)}
.btn-icon.btn-sm{width:30px;height:30px}
.btn-icon.btn-lg{width:44px;height:44px;border-radius:12px}

/* ============ INPUTS ============ */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:13px}
.field label{font-size:12px;font-weight:600;color:var(--g700)}
.input,.select,.textarea{width:100%;padding:10px 13px;border-radius:var(--r);border:1px solid var(--g200);background:var(--cream);font-size:13px;color:var(--ink);transition:border-color .15s,box-shadow .15s}
.input:focus,.select:focus,.textarea:focus{border-color:var(--fox);box-shadow:0 0 0 3px rgba(255,107,26,.15)}
.input::placeholder{color:var(--g400)}
.textarea{resize:vertical;min-height:70px;font-family:var(--font)}
.err{color:var(--red);font-size:11px;min-height:14px;margin-top:1px}
.input-group{position:relative}
.input-group .input{padding-left:38px}
.input-group .ig-i{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--g400);pointer-events:none;width:16px;height:16px}
.input-suffix{position:relative}
.input-suffix .suffix{position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--g500);font-size:11px;font-weight:600;pointer-events:none}

/* ============ CARDS ============ */
.card{background:var(--g50);border:1px solid var(--g200);border-radius:var(--r-lg);padding:18px}
[data-theme=dark] .card{background:var(--g100)}
.card-elev{box-shadow:var(--sh)}
.card-lg{padding:24px;border-radius:var(--r-xl)}
.card-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px;flex-wrap:wrap}
.card-title{font-size:15px;font-weight:700;color:var(--ink)}
.card-sub{font-size:12px;color:var(--g500);margin-top:2px}

/* ============ BADGES ============ */
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;line-height:1.5}
.bd{width:5px;height:5px;border-radius:50%;background:currentColor}
.b-green{background:var(--green-bg);color:var(--green)}
.b-red{background:var(--red-bg);color:var(--red)}
.b-amber{background:var(--amber-bg);color:var(--amber)}
.b-blue{background:var(--blue-bg);color:var(--blue)}
.b-gray{background:var(--g100);color:var(--g600)}
.b-fox{background:var(--fox-100);color:var(--fox-600)}
[data-theme=dark] .b-gray{background:var(--g200)}

/* ============ TOAST ============ */
.toast-host{position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:360px}
.toast{display:flex;align-items:center;gap:8px;padding:11px 14px;border-radius:var(--r);background:var(--ink);color:var(--cream);box-shadow:var(--sh-lg);font-size:13px;font-weight:500;pointer-events:auto;animation:ti .2s cubic-bezier(.2,.9,.3,1.2);min-width:220px;line-height:1.4}
.toast.success{background:var(--green)}
.toast.error{background:var(--red)}
.toast.info{background:var(--blue)}
.toast.out{animation:to .2s ease forwards}
@keyframes ti{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
@keyframes to{to{opacity:0;transform:translateX(20px)}}

/* ============ MODAL ============ */
.mb-back{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:9000;padding:16px;animation:fade .15s}
.modal{background:var(--g50);border-radius:var(--r-xl);width:100%;max-width:440px;max-height:90vh;overflow-y:auto;box-shadow:var(--sh-lg);animation:min .2s cubic-bezier(.2,.9,.3,1.1)}
[data-theme=dark] .modal{background:var(--g100)}
.modal-lg{max-width:600px}
.m-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--g200)}
.m-title{font-size:15px;font-weight:700}
.m-body{padding:20px}
.m-foot{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--g200);flex-wrap:wrap}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes min{from{opacity:0;transform:scale(.96) translateY(6px)}to{opacity:1;transform:none}}

/* ============ SKELETON ============ */
.skel{background:linear-gradient(90deg,var(--g100) 25%,var(--g200) 50%,var(--g100) 75%);background-size:200% 100%;animation:shim 1.2s infinite;border-radius:8px}
@keyframes shim{0%{background-position:200% 0}100%{background-position:-200% 0}}
.skel-line{height:14px;margin:8px 0}
.skel-block{height:80px;margin:12px 0}

/* ============ LANDING ============ */
.landing{min-height:100vh}
.topnav{position:sticky;top:0;z-index:100;backdrop-filter:blur(14px);background:rgba(255,245,238,.85);border-bottom:1px solid var(--g200)}
[data-theme=dark] .topnav{background:rgba(11,11,13,.85)}
.tn-inner{max-width:1140px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:12px 20px;gap:16px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;letter-spacing:-.02em;flex-shrink:0}
.logo-m{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--fox),var(--fox-600));display:grid;place-items:center;color:#fff;box-shadow:0 4px 12px rgba(255,107,26,.3);flex-shrink:0}
.nav-links{display:flex;gap:26px;align-items:center}
.nl{font-size:13px;font-weight:500;color:var(--g600);transition:color .15s}
.nl:hover,.nl:focus{color:var(--ink)}
.nav-actions{display:flex;gap:6px;align-items:center}

.hero{max-width:1140px;margin:0 auto;padding:60px 20px 80px;display:grid;grid-template-columns:1.05fr .95fr;gap:50px;align-items:center}
.hero-eyebrow{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;background:var(--fox-100);color:var(--fox-600);font-size:12px;font-weight:600;margin-bottom:20px}
.hero h1{font-size:52px;line-height:1.05;letter-spacing:-.03em;font-weight:900;margin-bottom:18px}
.hero h1 .grad{background:linear-gradient(135deg,var(--fox),var(--fox-600));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .lead{font-size:16px;line-height:1.6;color:var(--g600);margin-bottom:26px;max-width:480px}
.hero-cta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:28px}
.hero-stats{display:flex;gap:30px;flex-wrap:wrap}
.hs-num{font-size:22px;font-weight:800;letter-spacing:-.02em}
.hs-lbl{font-size:12px;color:var(--g500);margin-top:2px}

.hero-card{background:var(--g50);border:1px solid var(--g200);border-radius:var(--r-xl);padding:20px;box-shadow:var(--sh-lg)}
[data-theme=dark] .hero-card{background:var(--g100)}
.hero-amt{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:4px 0}

.section{max-width:1140px;margin:0 auto;padding:60px 20px}
.section-head{text-align:center;max-width:580px;margin:0 auto 40px}
.section-eyebrow{font-size:11px;font-weight:700;color:var(--fox);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}
.section-head h2{font-size:34px;line-height:1.15;letter-spacing:-.02em;font-weight:800;margin-bottom:12px}
.section-head p{font-size:15px;color:var(--g600);line-height:1.6}

.features{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.feature{background:var(--g50);border:1px solid var(--g200);border-radius:var(--r-lg);padding:22px;transition:transform .15s,box-shadow .15s}
[data-theme=dark] .feature{background:var(--g100)}
.feature:hover{transform:translateY(-2px);box-shadow:var(--sh-md)}
.feature-icon{width:42px;height:42px;border-radius:var(--r);background:var(--fox-100);color:var(--fox-600);display:grid;place-items:center;margin-bottom:14px}
.feature h3{font-size:14px;font-weight:700;margin-bottom:6px}
.feature p{font-size:13px;color:var(--g600);line-height:1.55}

.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.step{text-align:center;padding:16px}
.step-num{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,var(--fox),var(--fox-600));color:#fff;font-weight:800;font-size:20px;display:grid;place-items:center;margin:0 auto 14px;box-shadow:0 6px 20px rgba(255,107,26,.3)}
.step h3{font-size:15px;font-weight:700;margin-bottom:6px}
.step p{font-size:13px;color:var(--g600);line-height:1.55}

.pricing-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:stretch}
.price-card{background:var(--g50);border:1px solid var(--g200);border-radius:var(--r-lg);padding:26px;display:flex;flex-direction:column}
[data-theme=dark] .price-card{background:var(--g100)}
.price-card.featured{border:2px solid var(--fox);box-shadow:0 12px 40px rgba(255,107,26,.15);position:relative}
.price-badge{position:absolute;top:-11px;left:50%;transform:translateX(-50%);background:var(--fox);color:#fff;padding:3px 12px;border-radius:999px;font-size:11px;font-weight:700}
.price-name{font-size:13px;font-weight:600;color:var(--g600);margin-bottom:6px}
.price-amount{font-size:30px;font-weight:800;letter-spacing:-.02em;margin-bottom:4px}
.price-amount span{font-size:13px;font-weight:500;color:var(--g500)}
.price-desc{font-size:12px;color:var(--g500);margin-bottom:18px;min-height:36px}
.price-list{display:flex;flex-direction:column;gap:8px;margin-bottom:18px;flex:1}
.price-item{display:flex;gap:8px;font-size:13px;color:var(--g700)}
.price-item::before{content:'✓';color:var(--green);font-weight:700;flex-shrink:0}

.testimonials{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.testimonial{background:var(--g50);border:1px solid var(--g200);border-radius:var(--r-lg);padding:20px}
[data-theme=dark] .testimonial{background:var(--g100)}
.testimonial-quote{font-size:13px;color:var(--g700);line-height:1.6;margin-bottom:14px;font-style:italic}
.testimonial-author{display:flex;align-items:center;gap:10px}
.testimonial-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--fox),var(--fox-600));color:#fff;font-weight:700;font-size:13px;display:grid;place-items:center;flex-shrink:0}
.testimonial-name{font-size:13px;font-weight:600}
.testimonial-role{font-size:11px;color:var(--g500)}
.stars{display:flex;gap:2px;margin-bottom:10px;color:var(--amber)}

.faq-list{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.faq-item{background:var(--g50);border:1px solid var(--g200);border-radius:var(--r-lg);overflow:hidden}
[data-theme=dark] .faq-item{background:var(--g100)}
.faq-q{width:100%;text-align:left;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px;font-weight:600;color:var(--ink);transition:background .15s}
.faq-q:hover{background:var(--g100)}
.faq-q .chev{transition:transform .2s;flex-shrink:0;color:var(--g500)}
.faq-item.open .chev{transform:rotate(180deg)}
.faq-a{max-height:0;overflow:hidden;transition:max-height .25s ease}
.faq-item.open .faq-a{max-height:500px}
.faq-a-inner{padding:0 18px 16px;font-size:13px;color:var(--g600);line-height:1.6}

.cta-box{background:linear-gradient(135deg,var(--fox),var(--fox-600));border-radius:var(--r-xl);padding:48px 32px;text-align:center;color:#fff;box-shadow:0 16px 48px rgba(255,107,26,.25)}
.cta-box h2{font-size:30px;line-height:1.15;font-weight:800;letter-spacing:-.02em;margin-bottom:12px}
.cta-box p{font-size:15px;opacity:.9;margin-bottom:22px;max-width:480px;margin-left:auto;margin-right:auto}
.cta-box .btn{background:#fff;color:var(--fox-600);font-weight:700}

.site-footer{border-top:1px solid var(--g200);padding:48px 20px 28px;max-width:1140px;margin:0 auto}
.footer-grid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:32px;margin-bottom:32px}
.footer-col h4{font-size:12px;font-weight:700;color:var(--ink);text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px}
.footer-col a{display:block;font-size:13px;color:var(--g500);padding:4px 0;transition:color .15s}
.footer-col a:hover,.footer-col a:focus{color:var(--ink)}
.footer-bottom{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;padding-top:20px;border-top:1px solid var(--g200);font-size:12px;color:var(--g500)}
.footer-social{display:flex;gap:10px}
.footer-social a{width:32px;height:32px;border-radius:8px;background:var(--g100);color:var(--g600);display:grid;place-items:center;transition:all .15s}
.footer-social a:hover{background:var(--fox);color:#fff}

/* ============ AUTH ============ */
.auth-wrap{min-height:100vh;display:grid;grid-template-columns:1fr 1fr;background:var(--cream)}
.auth-side{background:linear-gradient(135deg,var(--fox),var(--fox-600));color:#fff;padding:40px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.auth-side::before{content:'';position:absolute;width:360px;height:360px;border-radius:50%;background:rgba(255,255,255,.08);top:-80px;right:-80px}
.auth-side::after{content:'';position:absolute;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.06);bottom:-80px;left:-80px}
.auth-side .logo{color:#fff;position:relative;z-index:1}
.auth-side .logo-m{background:rgba(255,255,255,.2);box-shadow:none}
.auth-side h2{font-size:26px;line-height:1.15;font-weight:800;letter-spacing:-.02em;position:relative;z-index:1}
.auth-side p{font-size:14px;opacity:.9;margin-top:10px;line-height:1.55;position:relative;z-index:1}
.auth-main{padding:40px;display:flex;align-items:center;justify-content:center}
.auth-box{width:100%;max-width:380px}
.auth-box h1{font-size:24px;font-weight:800;letter-spacing:-.02em;margin-bottom:4px}
.auth-box .sub{font-size:13px;color:var(--g500);margin-bottom:22px}
.auth-tabs{display:flex;gap:3px;background:var(--g100);padding:3px;border-radius:var(--r);margin-bottom:20px}
.auth-tab{flex:1;padding:7px;text-align:center;font-size:12px;font-weight:600;color:var(--g500);border-radius:7px;transition:all .15s}
.auth-tab.active{background:var(--g50);color:var(--ink);box-shadow:var(--sh)}
[data-theme=dark] .auth-tab.active{background:var(--g200)}
.auth-hint{font-size:11px;color:var(--g500);text-align:center;margin-top:16px;padding:10px;background:var(--g100);border-radius:var(--r);line-height:1.5}

/* ============ DASHBOARD ============ */
.dash{display:grid;grid-template-columns:var(--sidebar) 1fr;min-height:100vh;background:var(--g50)}
[data-theme=dark] .dash{background:var(--g50)}
.sidebar{background:var(--g50);border-right:1px solid var(--g200);padding:16px 10px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;overscroll-behavior:contain}
[data-theme=dark] .sidebar{background:var(--g100)}
.sidebar .logo{padding:4px 8px;margin-bottom:18px}
.side-nav{display:flex;flex-direction:column;gap:1px;flex:1}
.si{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;font-size:13px;font-weight:500;color:var(--g600);transition:background .15s,color .15s;width:100%;text-align:left}
.si:hover{background:var(--g100);color:var(--ink)}
[data-theme=dark] .si:hover{background:var(--g200)}
.si.active{background:var(--fox-100);color:var(--fox-600);font-weight:600}
[data-theme=dark] .si.active{background:var(--fox-100)}
.si svg{width:16px;height:16px;flex-shrink:0}
.si-sep{height:1px;background:var(--g200);margin:10px 6px}
.side-foot{padding-top:12px}
.side-user{display:flex;align-items:center;gap:9px;padding:8px;border-radius:9px;background:var(--g100);margin-bottom:6px}
[data-theme=dark] .side-user{background:var(--g200)}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--fox),var(--fox-600));color:#fff;font-weight:700;font-size:12px;display:grid;place-items:center;flex-shrink:0}
.avatar.sm{width:26px;height:26px;font-size:10px}
.avatar.lg{width:40px;height:40px;font-size:14px}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{background:var(--g50);border-bottom:1px solid var(--g200);padding:11px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:50}
[data-theme=dark] .topbar{background:var(--g100)}
.tb-title{font-size:17px;font-weight:700;letter-spacing:-.01em}
.tb-sub{font-size:12px;color:var(--g500);margin-top:1px}
.tb-actions{display:flex;gap:6px;align-items:center}
.content{padding:20px 22px 60px;max-width:1300px;width:100%;margin:0 auto;flex:1;min-height:60vh}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.kpi{background:var(--cream);border:1px solid var(--g200);border-radius:var(--r-lg);padding:16px;transition:box-shadow .15s}
[data-theme=dark] .kpi{background:var(--g100)}
.kpi:hover{box-shadow:var(--sh)}
.kpi-h{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.kpi-l{font-size:12px;color:var(--g500);font-weight:500}
.kpi-i{width:32px;height:32px;border-radius:9px;background:var(--fox-100);color:var(--fox-600);display:grid;place-items:center;flex-shrink:0}
.kpi-v{font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.1}

/* Wallet card */
.wallet-card{background:linear-gradient(135deg,var(--fox),var(--fox-600));border-radius:var(--r-xl);padding:22px;color:#fff;box-shadow:0 12px 32px rgba(255,107,26,.25);margin-bottom:16px;position:relative;overflow:hidden}
.wallet-card::before{content:'';position:absolute;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.08);top:-60px;right:-60px}
.wallet-label{font-size:12px;opacity:.85;font-weight:500;margin-bottom:4px;position:relative;z-index:1}
.wallet-amount{font-size:32px;font-weight:800;letter-spacing:-.02em;position:relative;z-index:1}
.wallet-actions{display:flex;gap:8px;margin-top:16px;position:relative;z-index:1;flex-wrap:wrap}
.wallet-actions .btn{background:rgba(255,255,255,.15);color:#fff;backdrop-filter:blur(8px)}
.wallet-actions .btn:hover{background:rgba(255,255,255,.25)}

/* Table */
.table-card{background:var(--cream);border:1px solid var(--g200);border-radius:var(--r-lg);overflow:hidden}
[data-theme=dark] .table-card{background:var(--g100)}
.tc-head{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--g200);flex-wrap:wrap}
.tc-head h3{font-size:14px;font-weight:700}
.tc-filters{display:flex;gap:6px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{text-align:left;padding:9px 16px;font-size:11px;font-weight:600;color:var(--g500);text-transform:uppercase;letter-spacing:.04em;background:var(--g100);border-bottom:1px solid var(--g200)}
[data-theme=dark] thead th{background:var(--g200)}
tbody td{padding:12px 16px;border-bottom:1px solid var(--g200);color:var(--g700)}
tbody tr:hover{background:var(--g100)}
[data-theme=dark] tbody tr:hover{background:var(--g200)}
tbody tr:last-child td{border-bottom:0}
.user-cell{display:flex;align-items:center;gap:9px}
.user-cell .info{min-width:0}
.user-cell .name{font-weight:600;color:var(--ink);font-size:12px}
.user-cell .sub{font-size:11px;color:var(--g500);margin-top:1px}

.empty{padding:48px 20px;text-align:center;color:var(--g500);font-size:13px}
.empty svg{margin:0 auto 10px;color:var(--g400)}
.empty h4{font-size:14px;font-weight:600;color:var(--ink);margin-bottom:4px}
.empty p{font-size:12px}

.pagination{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-top:1px solid var(--g200);font-size:12px;color:var(--g500);gap:8px;flex-wrap:wrap}

/* Chart */
.chart-card{background:var(--cream);border:1px solid var(--g200);border-radius:var(--r-lg);padding:16px;margin-bottom:16px}
[data-theme=dark] .chart-card{background:var(--g100)}
.chart-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.chart-head h3{font-size:14px;font-weight:700}
canvas{width:100%;display:block;max-width:100%}

/* Code block */
.code-block{background:var(--ink);color:#E5E5E5;padding:12px 14px;border-radius:var(--r);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;overflow-x:auto;display:flex;justify-content:space-between;align-items:center;gap:10px;word-break:break-all}
.code-block .mono{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Switch */
.switch{position:relative;width:38px;height:22px;background:var(--g300);border-radius:999px;transition:background .2s;flex-shrink:0;cursor:pointer;border:0}
.switch.on{background:var(--fox)}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch.on::after{transform:translateX(16px)}

.setting-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--g200);gap:12px}
.setting-row:last-child{border-bottom:0}
.si-info h4{font-size:13px;font-weight:600;margin-bottom:2px}
.si-info p{font-size:11px;color:var(--g500)}

/* Layout */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}

/* Perf */
.perf-skip{content-visibility:auto;contain-intrinsic-size:auto 60px}

/* ============ RESPONSIVE ============ */
@media (max-width:1024px){
  .hero{grid-template-columns:1fr;padding:40px 16px 60px}
  .hero h1{font-size:38px}
  .hero-card{display:none}
  .features,.steps,.pricing-grid,.testimonials{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .auth-wrap{grid-template-columns:1fr}
  .auth-side{display:none}
  .auth-main{padding:24px 16px}
  .grid-2,.grid-3{grid-template-columns:1fr}
  .section{padding:40px 16px}
  .section-head h2{font-size:26px}
  .footer-grid{grid-template-columns:1fr 1fr}
}
@media (max-width:768px){
  .dash{grid-template-columns:1fr}
  .sidebar{position:fixed;left:-100%;top:0;bottom:0;width:var(--sidebar);z-index:200;transition:left .2s;box-shadow:var(--sh-lg)}
  .sidebar.open{left:0}
  .sb-back{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:199;display:none}
  .sb-back.open{display:block}
  .topbar{padding:10px 14px}
  .content{padding:14px}
  .tb-title{font-size:15px}
  .nav-links{display:none}
  .hero h1{font-size:32px}
  .hero .lead{font-size:14px}
  .hide-sm{display:none}
  table{font-size:12px}
  thead th,tbody td{padding:8px 10px}
  .kpis{grid-template-columns:1fr}
  .wallet-amount{font-size:26px}
  .footer-grid{grid-template-columns:1fr}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}

   API CLIENT
   ============================================================ */
var api={
  inflight:new Set(),
  req:async function(path,opts){
    opts=opts||{};
    var ac=new AbortController();
    this.inflight.add(ac);
    var headers={'Content-Type':'application/json'};
    if(S.token)headers['Authorization']='Bearer '+S.token;
    if(opts.headers)Object.assign(headers,opts.headers);
    try{
      var res=await fetch(path,{method:opts.method||'GET',headers:headers,body:opts.body?JSON.stringify(opts.body):undefined,signal:ac.signal});
      if(res.status===401){
        S.token=null;S.user=null;
        localStorage.removeItem(TOKEN_KEY);
        if(location.hash!=='#/login'&&location.hash!=='#/register')location.hash='#/login';
        throw new Error('Sessiya tugadi, qayta kiring');
      }
      if(!res.ok){
        var msg='Xato '+res.status;
        try{var j=await res.json();if(j&&j.detail)msg=typeof j.detail==='string'?j.detail:JSON.stringify(j.detail);}catch(e){}
        throw new Error(msg);
      }
      if(res.status===204)return null;
      return await res.json();
    }finally{
      this.inflight.delete(ac);
    }
  },
  get:function(p){return this.req(p);},
  post:function(p,b){return this.req(p,{method:'POST',body:b});},
  put:function(p,b){return this.req(p,{method:'PUT',body:b});},
  del:function(p){return this.req(p,{method:'DELETE'});},
  abortAll:function(){this.inflight.forEach(function(a){a.abort();});this.inflight.clear();}
};

var toastHost=null,modalHost=null;
function toast(msg,type,ms){
  type=type||'info';ms=ms||3200;
  if(!toastHost)toastHost=document.getElementById('toast-host');
  var t=document.createElement('div');
  t.className='toast '+type;
  var i=type==='success'?'check':type==='error'?'x':'bell';
  t.innerHTML='<span style="display:inline-flex;flex-shrink:0">'+ic(i,15)+'</span><span>'+esc(msg)+'</span>';
  toastHost.appendChild(t);
  setTimeout(function(){t.classList.add('out');setTimeout(function(){t.remove();},220);},ms);
}
function modal(opts){
  if(!modalHost)modalHost=document.getElementById('modal-host');
  var back=document.createElement('div');back.className='mb-back';
  var box=document.createElement('div');box.className='modal'+(opts.size?' '+opts.size:'');
  box.innerHTML='<div class="m-head"><div class="m-title">'+esc(opts.title||'')+'</div><button class="btn btn-ghost btn-icon" data-close aria-label="Yopish">'+ic('x',16)+'</button></div>';
  var body=document.createElement('div');body.className='m-body';
  if(typeof opts.body==='string')body.innerHTML=opts.body;else if(opts.body)body.appendChild(opts.body);
  box.appendChild(body);
  if(opts.footer){var foot=document.createElement('div');foot.className='m-foot';if(typeof opts.footer==='string')foot.innerHTML=opts.footer;else foot.appendChild(opts.footer);box.appendChild(foot);}
  back.appendChild(box);modalHost.appendChild(back);
  var close=function(){back.remove();};
  back.addEventListener('click',function(e){if(e.target===back)close();});
  var cb=$('[data-close]',box);if(cb)cb.addEventListener('click',close);
  return {close:close,body:body,box:box};
}
function confirmDialog(title,msg,onOk,danger){
  var footer=document.createElement('div');footer.className='flex g2';

  ok.addEventListener('click',function(){m.close();onOk();});
}

   ============================================================ */
var chartCleanups=new Set();
function drawBar(canvas,data,labels){
  if(!canvas)return;
  var dpr=Math.min(window.devicePixelRatio||1,2);
  var rect=canvas.getBoundingClientRect();
  var W=Math.max(rect.width||400,200);
  var H=140;
  canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.height=H+'px';
  var ctx=canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);
  if(!data.length){
    ctx.fillStyle='#9CA3AF';ctx.font='12px system-ui';ctx.textAlign='center';
    ctx.fillText("Ma'lumot yo'q",W/2,H/2);return;
  }
  var pad={t:10,r:8,b:24,l:8};
  var cw=W-pad.l-pad.r,ch=H-pad.t-pad.b;
  var max=Math.max.apply(null,data)||1;
  var bw=Math.min(30,cw/data.length*0.62);
  var gap=cw/data.length;
  ctx.font='10px system-ui';ctx.textAlign='center';
  for(var i=0;i<data.length;i++){
    var v=data[i],h=(v/max)*ch;
    var x=pad.l+gap*i+(gap-bw)/2;
    var y=pad.t+ch-h;
    var r=Math.min(5,bw/2);
    ctx.beginPath();
    ctx.moveTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);ctx.lineTo(x+bw-r,y);ctx.arcTo(x+bw,y,x+bw,y+r,r);ctx.lineTo(x+bw,y+h);ctx.lineTo(x,y+h);ctx.closePath();
    ctx.fillStyle=(i===data.length-1)?'#FF6B1A':'rgba(255,107,26,.35)';
    ctx.fill();
    if(labels&&labels[i]!==undefined){
      ctx.fillStyle='#9CA3AF';
      ctx.fillText(labels[i],x+bw/2,H-6);
    }
  }
}
function mountChart(id,data,labels){
  var c=document.getElementById(id);if(!c)return;
  var draw=function(){drawBar(c,data,labels);};
  requestAnimationFrame(draw);
  var onResize=debounce(draw,200);
  window.addEventListener('resize',onResize);
  chartCleanups.add(function(){window.removeEventListener('resize',onResize);});
}
function cleanupCharts(){chartCleanups.forEach(function(f){try{f();}catch(e){}});chartCleanups.clear();}

async function handleAuth(mode,form){
  ['name','email','password'].forEach(function(f){var e=$('[data-err="'+f+'"]');if(e)e.textContent='';});
  var fd=new FormData(form);
  var email=String(fd.get('email')||'').trim();
  var password=String(fd.get('password')||'');
  var name=mode==='register'?String(fd.get('name')||'').trim():'';
  var phone=mode==='register'?String(fd.get('phone')||'').trim():'';

  var hasErr=false;
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){var e1=$('[data-err="email"]');if(e1)e1.textContent="To'g'ri email kiriting";hasErr=true;}
  if(password.length<6){var e2=$('[data-err="password"]');if(e2)e2.textContent='Parol kamida 6 belgi';hasErr=true;}
  if(mode==='register'&&name.length<2){var e3=$('[data-err="name"]');if(e3)e3.textContent='Ismingizni kiriting';hasErr=true;}
  if(hasErr)return;

  var btn=$('#authSubmit');
  var original=(mode==='register'?'Ro\'yxatdan o\'tish':'Kirish');
  btn.disabled=true;btn.textContent='Yuklanmoqda...';

  try{
    var path=mode==='register'?'/api/auth/register':'/api/auth/login';
    var payload=mode==='register'
      ? {name:name,email:email,password:password,phone:phone||null}
      : {email:email,password:password};

    var res=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    var data={};
    try{data=await res.json();}catch(e){}

    if(!res.ok){
      var msg=data.detail||data.message||('Xato '+res.status);
      throw new Error(typeof msg==='string'?msg:JSON.stringify(msg));
    }

    if(!data.token||!data.user){
      throw new Error('Server javobi noto\'g\'ri');
    }

    S.token=data.token;
    S.user=data.user;
    localStorage.setItem(TOKEN_KEY,data.token);

    toast('Xush kelibsiz, '+data.user.name+'!','success');
    setTimeout(function(){go('/app');},300);

  }catch(e){
    console.error('[auth] error',e);
    var m=e.message||'Tarmoq xatosi';
    if(m.indexOf('Failed to fetch')>=0||m.indexOf('NetworkError')>=0){
      m='Server bilan aloqa yo\'q. Internetni tekshiring.';
    }
    toast(m,'error',5000);
    btn.disabled=false;btn.textContent=original;
  }
}

function buildSeries(list){
  var buckets=new Array(7).fill(0);
  var labels=[];
  var now=new Date();
  for(var i=6;i>=0;i--){var d=new Date(now);d.setDate(d.getDate()-i);labels.push(d.getDate()+'/'+(d.getMonth()+1));}
  list.forEach(function(t){
    if(!t.created_at)return;
    var d=new Date(t.created_at);
    var diff=Math.floor((now-d)/86400000);
    if(diff>=0&&diff<7)buckets[6-diff]+=t.amount_tiyin/100;
  });
  return {values:buckets,labels:labels};
}

async function loadIntents(gen){
  var el=$('#intentsList');if(!el)return;
  try{
    var list=await api.get('/api/pay/intents');
    if(gen!==S.gen)return;
    if(!list.length){el.innerHTML=emptyState('creditCard','Intentlar yo\'q','Birinchi payment intent yarating');return;}
    var h='<div style="overflow-x:auto"><table><thead><tr><th>Summa</th><th>Holat</th><th>Tavsif</th><th>Amal</th></tr></thead><tbody>';
    list.forEach(function(i){
      var st=i.status==='succeeded'?'b-green':i.status==='failed'?'b-red':'b-amber';
      var canConfirm=i.status==='requires_payment';
      h+='<tr class="perf-skip">'+
        '<td class="fw6">'+fmtUZS(i.amount_tiyin)+'</td>'+
        '<td><span class="badge '+st+'"><span class="bd"></span>'+esc(i.status)+'</span></td>'+
        '<td class="t-sm muted">'+esc(i.description||'—')+'</td>'+
        '<td>'+(canConfirm?'<button class="btn btn-primary btn-xs" data-confirm="'+esc(i.intent_id)+'">Tasdiqlash</button>':'<span class="t-xs muted">'+fmtDT(i.created_at)+'</span>')+'</td>'+
      '</tr>';
    });
    el.innerHTML=h+'</tbody></table></div>';
    el.querySelectorAll('[data-confirm]').forEach(function(b){
      b.addEventListener('click',async function(ev){
        var btn=ev.currentTarget;btn.disabled=true;btn.textContent='...';
        try{
          await api.post('/api/pay/intents/'+btn.dataset.confirm+'/confirm');
          toast('To\'lov tasdiqlandi','success');
          loadIntents(gen);
        }catch(err){
          toast(err.message,'error');
          btn.disabled=false;btn.textContent='Tasdiqlash';
        }
      });
    });
  }catch(e){
    if(gen!==S.gen)return;
    el.innerHTML=emptyState('x','Xato',e.message);
  }
}

  var ok=document.createElement('button');ok.className='btn btn-primary';ok.textContent='Yaratish';
  footer.appendChild(cancel);footer.appendChild(ok);

/* ============================================================
   ROUTER
   ============================================================ */
async function route(){
  var path=parseHash();
  api.abortAll();
  cleanupCharts();

  if(path==='/'||path===''){return renderLanding();}
  if(path==='/login'){if(S.token){go('/app');return;}return renderAuth('login');}
  if(path==='/register'){if(S.token){go('/app');return;}return renderAuth('register');}
  if(path.indexOf('/app')===0){
    if(!S.token){go('/login');return;}
    var active=path.replace(/^\/app/,'')||'/';
    if(!S.user){
      try{S.user=await api.get('/api/auth/me');}
      catch(e){
        S.token=null;S.user=null;
        localStorage.removeItem(TOKEN_KEY);
        go('/login');
        return;
      }
    }
    renderShell(active);
    await renderView(active);
    return;
  }
  renderLanding();
}

/* ============================================================
   BOOT
   ============================================================ */
function boot(){
  window.addEventListener('hashchange',route);
  var idle=window.requestIdleCallback||function(fn){return setTimeout(fn,1);};
  if(S.token){
    idle(async function(){
      try{S.user=await api.get('/api/auth/me');}catch(e){S.token=null;localStorage.removeItem(TOKEN_KEY);}
      route();
    });
  }else{
    route();
  }
}

if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);
else boot();

})();
