<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter','Noto Sans SC',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;font-size:14px;overflow-x:hidden;-webkit-font-smoothing:antialiased}
html[lang="zh"] body{font-family:'Noto Sans SC',sans-serif}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit;background:none;border:0;outline:none}
ul{list-style:none}
img,svg{display:block;max-width:100%}

:root{--bg:#0B1120;--panel:#0F172A;--panel2:#141E33;--border:#1E293B;--fox:#FF6B00;--fox2:#E64A00;--cyan:#00F2FE;--text:#F8FAFC;--muted:#94A3B8;--green:#10B981;--green-bg:rgba(16,185,129,.12);--red:#EF4444;--red-bg:rgba(239,68,68,.12);--amber:#F59E0B;--amber-bg:rgba(245,158,11,.12);--r:10px;--r-lg:14px;--r-xl:18px;--sh-lg:0 12px 40px rgba(0,0,0,.5);--sidebar-w:260px}
[data-theme="light"]{--bg:#F8FAFC;--panel:#FFF;--panel2:#F1F5F9;--border:#E2E8F0;--text:#0F172A;--muted:#475569;--sh-lg:0 12px 40px rgba(0,0,0,.1)}

.flex{display:flex}.fcol{flex-direction:column}.ai-c{align-items:center}.jc-b{justify-content:space-between}.jc-c{justify-content:center}
.g1{gap:4px}.g2{gap:8px}.g3{gap:12px}.g4{gap:16px}.g6{gap:24px}
.grow{flex:1;min-width:0}.wrap{flex-wrap:wrap}
.t-xs{font-size:11px}.t-sm{font-size:12px}.t-md{font-size:13px}.t-lg{font-size:15px}.t-xl{font-size:18px}.t-2xl{font-size:24px}.t-3xl{font-size:32px}
.fw5{font-weight:500}.fw6{font-weight:600}.fw7{font-weight:700}.fw8{font-weight:800}.fw9{font-weight:900}
.muted{color:var(--muted)}.text-c{text-align:center}.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mono{font-family:ui-monospace,monospace}
.mt2{margin-top:8px}.mt4{margin-top:16px}.mb2{margin-bottom:8px}.mb4{margin-bottom:16px}
.w100{width:100%}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:var(--r);font-weight:600;font-size:13px;transition:all .15s;border:1px solid transparent;white-space:nowrap}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:linear-gradient(135deg,var(--fox),var(--fox2));color:#fff;box-shadow:0 2px 8px rgba(255,107,0,.25)}
.btn-primary:hover{box-shadow:0 4px 16px rgba(255,107,0,.4)}
.btn-outline{border-color:var(--border);background:var(--panel);color:var(--text)}
.btn-outline:hover{background:var(--panel2)}
.btn-ghost{color:var(--muted)}.btn-ghost:hover{color:var(--text);background:var(--panel2)}
.btn-sm{padding:6px 12px;font-size:12px}.btn-block{width:100%}.btn-icon{width:36px;height:36px;padding:0;border-radius:var(--r)}

.input{width:100%;padding:10px 14px;border-radius:var(--r);border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:13px;transition:all .15s}
.input:focus{border-color:var(--fox);box-shadow:0 0 0 3px rgba(255,107,0,.15)}
.field{margin-bottom:16px}.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px}

.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r-lg);padding:20px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:600}
.bd{width:6px;height:6px;border-radius:50%;background:currentColor}
.b-green{background:var(--green-bg);color:var(--green)}
.b-red{background:var(--red-bg);color:var(--red)}
.b-amber{background:var(--amber-bg);color:var(--amber)}
.b-cyan{background:rgba(0,242,254,.12);color:var(--cyan)}

.toast-host{position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:10px;pointer-events:none;max-width:360px}
.toast{padding:12px 18px;border-radius:var(--r);background:var(--panel);border:1px solid var(--border);color:var(--text);font-size:13px;font-weight:600;box-shadow:var(--sh-lg);animation:slideIn .3s;pointer-events:auto;display:flex;align-items:center;gap:8px}
.toast.success{border-color:var(--green);color:var(--green)}
.toast.error{border-color:var(--red);color:var(--red)}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:none;opacity:1}}

.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:9000;padding:20px}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:var(--r-xl);width:100%;max-width:480px;overflow:hidden}
.modal-head{padding:20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal-body{padding:20px}
.modal-foot{padding:16px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}

.lang-switch{position:relative}
.lang-btn{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:var(--r);border:1px solid var(--border);background:var(--panel);color:var(--text);font-size:12px;font-weight:600;cursor:pointer}
.lang-menu{position:absolute;top:calc(100% + 6px);right:0;background:var(--panel);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh-lg);min-width:170px;z-index:500;display:none}
.lang-menu.open{display:block}
.lang-opt{padding:10px 14px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:10px}
.lang-opt:hover{background:var(--panel2)}
.lang-opt.active{background:rgba(255,107,0,.1);color:var(--fox);font-weight:600}

.landing{min-height:100vh}
.topnav{position:sticky;top:0;z-index:100;backdrop-filter:blur(16px);background:rgba(11,17,32,.8);border-bottom:1px solid var(--border)}
[data-theme="light"] .topnav{background:rgba(248,250,252,.85)}
.tn-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:14px 24px;gap:16px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}
.nav-links{display:flex;gap:28px;align-items:center}
.nl{font-size:13px;font-weight:500;color:var(--muted);cursor:pointer}
.nl:hover{color:var(--text)}
.nav-actions{display:flex;gap:8px;align-items:center}

.hero{max-width:1200px;margin:0 auto;padding:80px 24px 100px;display:grid;grid-template-columns:1.1fr .9fr;gap:60px;align-items:center}
.hero-eyebrow{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;background:rgba(255,107,0,.1);color:var(--fox);font-size:12px;font-weight:600;margin-bottom:24px;border:1px solid rgba(255,107,0,.2)}
.hero h1{font-size:56px;line-height:1.05;letter-spacing:-.03em;font-weight:900;margin-bottom:20px}
.hero h1 .grad{background:linear-gradient(135deg,var(--fox),var(--fox2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .lead{font-size:17px;color:var(--muted);margin-bottom:32px;max-width:520px;line-height:1.65}
.hero-cta{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:40px}
.hero-stats{display:flex;gap:40px;flex-wrap:wrap}
.hs-num{font-size:24px;font-weight:800}
.hs-lbl{font-size:12px;color:var(--muted);margin-top:2px}

.hero-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r-xl);padding:24px;box-shadow:var(--sh-lg)}
.hero-amt{font-size:32px;font-weight:800;margin:4px 0}

.section{max-width:1200px;margin:0 auto;padding:80px 24px}
.section-head{text-align:center;max-width:640px;margin:0 auto 48px}
.section-eyebrow{font-size:12px;font-weight:700;color:var(--fox);text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px}
.section-head h2{font-size:38px;line-height:1.15;font-weight:800;margin-bottom:14px}
.section-head p{font-size:16px;color:var(--muted);line-height:1.6}

.features{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.feature{background:var(--panel);border:1px solid var(--border);border-radius:var(--r-lg);padding:24px;transition:all .2s}
.feature:hover{transform:translateY(-3px);box-shadow:var(--sh-lg);border-color:var(--fox)}
.feature-icon{width:44px;height:44px;border-radius:12px;background:rgba(255,107,0,.12);color:var(--fox);display:grid;place-items:center;margin-bottom:16px}
.feature h3{font-size:15px;font-weight:700;margin-bottom:8px}
.feature p{font-size:13px;color:var(--muted);line-height:1.6}

.pricing-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.price-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r-lg);padding:28px;display:flex;flex-direction:column;position:relative}
.price-card.featured{border:2px solid var(--fox);box-shadow:0 16px 50px rgba(255,107,0,.2)}
.price-badge{position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,var(--fox),var(--fox2));color:#fff;padding:4px 14px;border-radius:999px;font-size:11px;font-weight:700}
.price-name{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:8px}
.price-amount{font-size:30px;font-weight:800;margin-bottom:6px}
.price-amount span{font-size:13px;font-weight:500;color:var(--muted)}
.price-desc{font-size:12px;color:var(--muted);margin-bottom:20px;min-height:36px}
.price-list{display:flex;flex-direction:column;gap:10px;margin-bottom:20px;flex:1}
.price-item{font-size:13px;color:var(--muted);line-height:1.5}

.faq-list{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.faq-item{background:var(--panel);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden}
.faq-q{width:100%;text-align:left;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px;font-weight:600;cursor:pointer}
.faq-q:hover{background:var(--panel2)}
.faq-q .chev{transition:transform .2s;color:var(--muted)}
.faq-item.open .chev{transform:rotate(180deg)}
.faq-a{max-height:0;overflow:hidden;transition:max-height .3s}
.faq-item.open .faq-a{max-height:500px}
.faq-a-inner{padding:0 20px 16px;font-size:13px;color:var(--muted);line-height:1.7}

.cta-box{background:linear-gradient(135deg,var(--fox),var(--fox2));border-radius:var(--r-xl);padding:56px 40px;text-align:center;color:#fff;box-shadow:0 20px 60px rgba(255,107,0,.3)}
.cta-box h2{font-size:34px;font-weight:800;margin-bottom:14px}
.cta-box p{font-size:15px;opacity:.9;margin-bottom:24px;max-width:500px;margin-left:auto;margin-right:auto}
.cta-box .btn{background:#fff;color:var(--fox2);font-weight:700}

.site-footer{border-top:1px solid var(--border);padding:56px 24px 32px;max-width:1200px;margin:0 auto}
.footer-grid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:32px;margin-bottom:40px}
.footer-col h4{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:14px}
.footer-col a{display:block;font-size:13px;color:var(--muted);padding:5px 0;cursor:pointer}
.footer-col a:hover{color:var(--text)}
.footer-bottom{display:flex;justify-content:space-between;flex-wrap:wrap;gap:16px;padding-top:24px;border-top:1px solid var(--border);font-size:12px;color:var(--muted)}

.auth-wrap{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
.auth-side{background:radial-gradient(circle at 50% 50%,#0F172A 0%,#020617 100%);padding:48px;display:flex;flex-direction:column;justify-content:space-between;color:#F8FAFC}
.auth-main{padding:48px;display:flex;align-items:center;justify-content:center;background:var(--bg)}
.auth-box{width:100%;max-width:400px}
.auth-tabs{display:flex;gap:4px;background:var(--panel);padding:4px;border-radius:var(--r);margin-bottom:24px;border:1px solid var(--border)}
.auth-tab{flex:1;padding:8px;text-align:center;font-size:13px;font-weight:600;color:var(--muted);border-radius:8px;cursor:pointer}
.auth-tab.active{background:var(--panel2);color:var(--text)}

.dash{display:grid;grid-template-columns:var(--sidebar-w) 1fr;min-height:100vh}
.sidebar{background:var(--panel);border-right:1px solid var(--border);padding:20px 12px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.side-nav{display:flex;flex-direction:column;gap:2px;flex:1}
.si{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:9px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;transition:all .15s;width:100%;text-align:left}
.si:hover{background:var(--panel2);color:var(--text)}
.si.active{background:rgba(255,107,0,.1);color:var(--fox);font-weight:600;border-left:3px solid var(--fox)}
.si svg{width:16px;height:16px;flex-shrink:0}

.main{display:flex;flex-direction:column}
.topbar{background:rgba(15,23,42,.8);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:50;gap:12px;flex-wrap:wrap}
[data-theme="light"] .topbar{background:rgba(248,250,252,.85)}
.content{padding:24px;max-width:1300px;margin:0 auto;width:100%}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.kpi{background:var(--panel);border:1px solid var(--border);border-radius:var(--r-lg);padding:20px}
.kpi-l{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:10px}
.kpi-v{font-size:24px;font-weight:800}

.wallet-banner{background:linear-gradient(135deg,var(--fox) 0%,var(--fox2) 100%);border-radius:var(--r-xl);padding:28px;color:#fff;box-shadow:0 12px 32px rgba(255,107,0,.25);margin-bottom:24px}
.wallet-amount{font-size:36px;font-weight:800;margin-top:6px}
.wallet-actions{display:flex;gap:12px;margin-top:20px;flex-wrap:wrap}
.wallet-actions .btn{background:rgba(255,255,255,.15);color:#fff}
.wallet-actions .btn:hover{background:rgba(255,255,255,.25)}

.table-wrap{background:var(--panel);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:12px 20px;background:rgba(255,255,255,.02);color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border)}
td{padding:14px 20px;border-bottom:1px solid var(--border)}
tr:last-child td{border-bottom:0}
tr:hover td{background:rgba(255,255,255,.02)}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}

.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--fox),var(--fox2));color:#fff;font-weight:700;font-size:12px;display:grid;place-items:center;flex-shrink:0}

@media(max-width:1024px){
.dash{grid-template-columns:1fr}
.sidebar{position:fixed;left:-100%;top:0;bottom:0;z-index:200;transition:left .3s;width:280px;box-shadow:var(--sh-lg)}
.sidebar.open{left:0}
.auth-wrap{grid-template-columns:1fr}
.auth-side{display:none}
.kpis{grid-template-columns:1fr 1fr}
.grid-2,.grid-3{grid-template-columns:1fr}
.hero{grid-template-columns:1fr;padding:48px 20px 64px}
.hero h1{font-size:38px}
.hero-card{display:none}
.features,.pricing-grid{grid-template-columns:1fr}
.footer-grid{grid-template-columns:1fr 1fr}
.nav-links{display:none}
}
@media(max-width:600px){
.kpis{grid-template-columns:1fr}
.content{padding:16px}
.wallet-amount{font-size:28px}
.hero h1{font-size:30px}
.section{padding:48px 16px}
.section-head h2{font-size:26px}
.footer-grid{grid-template-columns:1fr}
}
</style>
</head>

var LANG_KEY='foxpay.lang';
var currentLang=localStorage.getItem(LANG_KEY)||'uz';
if(!I18N[currentLang])currentLang='uz';

function t(path){
  var keys=path.split('.');
  var obj=I18N[currentLang];
  for(var i=0;i<keys.length;i++){if(!obj)return path;obj=obj[keys[i]];}
  return obj||path;
}
function setLang(code){
  if(!I18N[code])return;
  currentLang=code;
  localStorage.setItem(LANG_KEY,code);
  document.documentElement.lang=code;
  router();
}
function langSwitcher(){
  var html='<div class="lang-switch"><button class="lang-btn" data-lang-toggle>'+I18N[currentLang].flag+' '+currentLang.toUpperCase()+'</button><div class="lang-menu" data-lang-menu>';
  Object.keys(I18N).forEach(function(code){
    html+='<div class="lang-opt '+(code===currentLang?'active':'')+'" data-lang="'+code+'">'+I18N[code].flag+' '+I18N[code].name+'</div>';
  });
  return html+'</div></div>';
}
function bindLang(){
  document.querySelectorAll('[data-lang-toggle]').forEach(function(btn){
    btn.onclick=function(e){e.stopPropagation();btn.nextElementSibling.classList.toggle('open');};
  });
  document.querySelectorAll('[data-lang]').forEach(function(el){
    el.onclick=function(e){e.stopPropagation();setLang(el.getAttribute('data-lang'));};
  });
  document.addEventListener('click',function(){document.querySelectorAll('[data-lang-menu]').forEach(function(m){m.classList.remove('open');});});
}

function toast(msg,type){
  type=type||'success';
  var host=document.getElementById('toast-host');
  var el=document.createElement('div');
  el.className='toast '+type;
  el.innerHTML=ic(type==='success'?'check':'x',16)+'<span>'+esc(msg)+'</span>';
  host.appendChild(el);
  setTimeout(function(){el.style.opacity='0';setTimeout(function(){el.remove();},300);},3000);
}
function openModal(title,body,footer){
  var host=document.getElementById('modal-host');
  var back=document.createElement('div');
  back.className='modal-back';
  back.innerHTML='<div class="modal"><div class="modal-head"><div class="t-lg fw7">'+esc(title)+'</div><button onclick="closeModal()" class="btn-ghost btn-icon">'+ic('x',18)+'</button></div><div class="modal-body">'+body+'</div>'+(footer?'<div class="modal-foot">'+footer+'</div>':'')+'</div>';
  back.onclick=function(e){if(e.target===back)closeModal();};
  host.appendChild(back);
}
function closeModal(){document.getElementById('modal-host').innerHTML='';}

var api={
  req:async function(path,method,body){
    var headers={'Content-Type':'application/json'};
    if(State.token)headers['Authorization']='Bearer '+State.token;
    try{
      var res=await fetch(path,{method:method||'GET',headers:headers,body:body?JSON.stringify(body):undefined});
      if(res.status===401){logout();throw new Error(t('auth.sessionExpired'));}
      if(!res.ok){var data=await res.json().catch(function(){return{};});throw new Error(data.detail||'Error '+res.status);}
      if(res.status===204)return null;
      return await res.json();
    }catch(err){throw new Error(err.message==='Failed to fetch'?t('auth.networkError'):err.message);}
  },
  get:function(p){return this.req(p,'GET');},
  post:function(p,b){return this.req(p,'POST',b);},
  put:function(p,b){return this.req(p,'PUT',b);},
  del:function(p){return this.req(p,'DELETE');}
};

async function handleAuth(e,mode){
  e.preventDefault();
  var form=new FormData(e.target);
  var email=form.get('email').trim();
  var password=form.get('password');
  var name=form.get('name')?form.get('name').trim():'';
  if(!isValidEmail(email))return toast(t('auth.invalidEmail'),'error');
  if(password.length<6)return toast(t('auth.shortPassword'),'error');
  if(mode==='register'&&(!name||name.length<2))return toast(t('auth.nameRequired'),'error');
  var btn=e.target.querySelector('button[type="submit"]');
  var orig=btn.innerHTML;
  btn.innerHTML=t('auth.loading');btn.disabled=true;
  try{
    var payload=mode==='register'?{name:name,email:email,password:password}:{email:email,password:password};
    var data=await api.post('/api/auth/'+mode,payload);
    State.token=data.token;State.user=data.user;
    localStorage.setItem(Config.tokenKey,State.token);
    localStorage.setItem(Config.userKey,JSON.stringify(State.user));
    toast(t('toast.welcome')+', '+data.user.name+'!');
    window.location.hash='#/';
  }catch(err){
    toast(err.message,'error');
    btn.innerHTML=orig;btn.disabled=false;
  }
}
function logout(){
  State.token=null;State.user=null;
  localStorage.removeItem(Config.tokenKey);
  localStorage.removeItem(Config.userKey);
  window.location.hash='#/login';
}

function router(){
  var hash=window.location.hash.replace('#','')||'/';
  if(!State.token){if(hash==='/register')renderAuth('register');else renderAuth('login');return;}
  if(hash==='/login'||hash==='/register'||hash==='/')renderDashboard('/');
  else renderDashboard(hash);
}

async function renderView(view){
  var c=document.getElementById('view-content');
  c.innerHTML='<div class="card"><div class="t-md muted">'+t('auth.loading')+'</div></div>';
  try{
    switch(view){
      case '/':await viewOverview(c);break;
      case '/wallet':await viewWallet(c);break;
      case '/p2p':await viewP2P(c);break;
      case '/payments':await viewPayments(c);break;
      case '/links':viewStatic(c,'🔗','menu.links');break;
      case '/invoices':viewStatic(c,'📄','menu.invoices');break;
      case '/agents':viewAgents(c);break;
      case '/subscriptions':viewSubscriptions(c);break;
      case '/dev':await viewDev(c);break;
      case '/settings':viewSettings(c);break;
    }
  }catch(e){c.innerHTML='<div class="card" style="border-color:var(--red)"><div class="fw7" style="color:var(--red)">'+t('toast.error')+'</div><div class="t-sm muted mt2">'+esc(e.message)+'</div></div>';}
}

function viewSubscriptions(c){

}

async function viewDev(c){
  var keys=await api.get('/api/keys').catch(function(){return[];});
  c.innerHTML='<div class="grid-2"><div class="card"><div class="flex jc-b ai-c mb4"><h3 class="t-lg fw7">'+t('dash.apiKeys')+'</h3><button class="btn btn-primary btn-sm" onclick="createApiKey()">'+t('dash.newKey')+'</button></div>'+
  (keys.length?keys.map(function(k){return '<div class="flex jc-b ai-c" style="padding:12px 0;border-bottom:1px solid var(--border)"><div><div class="fw6 mono">'+esc(k.prefix)+'...</div><div class="t-xs muted">'+esc(k.label)+' • '+(k.is_active?'✓':'✗')+'</div></div>'+(k.is_active?'<button class="btn btn-ghost btn-sm" style="color:var(--red)" onclick="revokeKey('+k.id+')">'+ic('trash',14)+'</button>':'')+'</div>';}).join(''):'<div class="t-sm muted">'+t('dash.keysEmpty')+'</div>')+
  '</div><div class="card"><h3 class="t-lg fw7 mb4">'+t('dash.webhookUrl')+'</h3><div class="field"><label>'+t('dash.urlAddress')+'</label><input class="input" placeholder="https://mysite.uz/webhook"></div><button class="btn btn-primary btn-block" onclick="toast(\''+t('toast.saved')+'\')">'+t('dash.save')+'</button></div></div>';
}
async function createApiKey(){
  try{
    var res=await api.post('/api/keys',{label:'Default Key'});
    openModal(t('toast.keyCreated'),'<p class="t-sm muted mb4">'+t('toast.keyCreated')+'</p><div class="input mono" style="background:var(--bg);padding:12px;word-break:break-all">'+res.full_key+'</div>','<button class="btn btn-primary" onclick="closeModal();renderView(\'/dev\')">OK</button>');
  }catch(e){toast(e.message,'error');}
}
async function revokeKey(id){
  if(!confirm(t('toast.confirmRevoke')))return;
  try{await api.del('/api/keys/'+id);toast(t('toast.keyRevoked'));renderView('/dev');}catch(e){toast(e.message,'error');}
}
